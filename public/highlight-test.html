<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Highlight Test — Raynes Park / Wimbledon Chase</title>
<style>
  body { font-family: monospace; background: #060c18; color: #cdd6f4; margin: 0; padding: 16px; }
  h1 { color: #2a7fff; font-size: 1.1rem; margin-bottom: 16px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  label { color: #888; font-size: 0.85rem; }
  input { background: #0e1828; border: 1px solid #1e3050; color: #cdd6f4; padding: 6px 10px; border-radius: 4px; font-family: monospace; font-size: 0.9rem; }
  button { background: #2a7fff; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.9rem; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #1e3050; }
  #status { font-size: 0.8rem; color: #888; margin-bottom: 12px; min-height: 1.2em; }
  #stats { font-size: 0.8rem; color: #555; margin-bottom: 12px; display: none; }
  #stats span { margin-right: 16px; }
  #stats .hi { color: #00e676; }
  table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
  th { background: #132035; color: #2a7fff; padding: 6px 10px; text-align: left; border-bottom: 1px solid #1e3050; position: sticky; top: 0; }
  td { padding: 5px 10px; border-bottom: 1px solid #0e1828; vertical-align: middle; }
  tr.highlight { background: #0a2010; }
  tr.highlight td:first-child { border-left: 3px solid #00e676; }
  .badge { display: inline-block; border-radius: 3px; padding: 1px 5px; font-size: 0.75rem; font-weight: bold; margin-right: 3px; }
  .badge-ray { background: #00e676; color: #060c18; }
  .badge-wbo { background: #00c9a7; color: #060c18; }
  .err { color: #ff4d6a; }
  .pending { color: #888; font-style: italic; }
</style>
</head>
<body>
<h1>Highlight Test — Raynes Park / Wimbledon Chase (filterCrs approach)</h1>

<div class="controls">
  <label>Station CRS:</label>
  <input id="crs" type="text" value="WAT" maxlength="3" style="width:60px; text-transform:uppercase;">
  <button id="fetchBtn" onclick="fetchBoard()">Fetch Departures</button>
  <button id="highlightBtn" class="secondary" onclick="fetchHighlights()" disabled>Highlight via filterCrs</button>
  <button class="secondary" onclick="clearHighlights()">Clear</button>
</div>

<div id="status">Enter a CRS code and click Fetch Departures.</div>
<div id="stats">
  <span>RAY filter: <span id="rayCount">—</span></span>
  <span>WBO filter: <span id="wboCount">—</span></span>
  <span class="hi">Highlighted: <span id="matchCount">—</span> of <span id="totalCount">—</span></span>
</div>

<div id="output"></div>

<script>
let services = [];

function setStatus(msg, isErr) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isErr ? 'err' : '';
}

async function fetchBoard() {
  const crs = document.getElementById('crs').value.trim().toUpperCase().slice(0, 3);
  if (!crs) { setStatus('Enter a CRS code.', true); return; }

  setStatus(`Fetching departures from ${crs}…`);
  document.getElementById('fetchBtn').disabled = true;
  document.getElementById('highlightBtn').disabled = true;
  document.getElementById('stats').style.display = 'none';
  services = [];
  document.getElementById('output').innerHTML = '';

  try {
    const res = await fetch(`/api/trains?crs=${crs}&rows=150`);
    const data = await res.json();
    if (data.error) { setStatus(`API error: ${data.error}`, true); return; }

    services = (data.services || []).map(s => ({ ...s, _matchRay: false, _matchWbo: false, _matchDone: false }));
    setStatus(`${services.length} service(s) from ${crs}. Click "Highlight via filterCrs" to identify RAY/WBO services.`);
    renderTable(false);
    document.getElementById('highlightBtn').disabled = false;
  } catch (e) {
    setStatus(`Fetch failed: ${e.message}`, true);
  } finally {
    document.getElementById('fetchBtn').disabled = false;
  }
}

async function fetchHighlights() {
  if (!services.length) return;
  const crs = document.getElementById('crs').value.trim().toUpperCase().slice(0, 3);

  setStatus(`Fetching RAY and WBO filtered boards from ${crs}…`);
  document.getElementById('highlightBtn').disabled = true;

  const [rayResult, wboResult] = await Promise.allSettled([
    fetch(`/api/trains?crs=${crs}&filterCrs=RAY&rows=150`).then(r => r.json()),
    fetch(`/api/trains?crs=${crs}&filterCrs=WBO&rows=150`).then(r => r.json()),
  ]);

  const rayServices = rayResult.status === 'fulfilled' && !rayResult.value.error
    ? (rayResult.value.services || []) : [];
  const wboServices = wboResult.status === 'fulfilled' && !wboResult.value.error
    ? (wboResult.value.services || []) : [];

  const rayIds = new Set(rayServices.map(s => s.serviceId));
  const wboIds = new Set(wboServices.map(s => s.serviceId));

  services.forEach(svc => {
    svc._matchRay  = rayIds.has(svc.serviceId);
    svc._matchWbo  = wboIds.has(svc.serviceId);
    svc._matchDone = true;
  });

  const matchCount = services.filter(s => s._matchRay || s._matchWbo).length;

  const rayErr = rayResult.status === 'rejected' || rayResult.value?.error;
  const wboErr = wboResult.status === 'rejected' || wboResult.value?.error;

  document.getElementById('rayCount').textContent = rayErr ? `error: ${rayResult.value?.error || rayResult.reason}` : rayServices.length;
  document.getElementById('wboCount').textContent = wboErr ? `error: ${wboResult.value?.error || wboResult.reason}` : wboServices.length;
  document.getElementById('matchCount').textContent = matchCount;
  document.getElementById('totalCount').textContent = services.length;
  document.getElementById('stats').style.display = 'block';

  setStatus(matchCount > 0
    ? `${matchCount} service(s) call at Raynes Park or Wimbledon Chase.`
    : `No matching services found — filterCrs may only match final-destination trains.`);

  renderTable(true);
  document.getElementById('highlightBtn').disabled = false;
}

function clearHighlights() {
  services.forEach(s => { s._matchRay = false; s._matchWbo = false; s._matchDone = false; });
  document.getElementById('stats').style.display = 'none';
  renderTable(false);
  setStatus('Highlights cleared.');
}

function renderTable(showHighlights) {
  const rows = services.map(svc => {
    const hi = showHighlights && (svc._matchRay || svc._matchWbo);
    const badges = !showHighlights ? '' :
      (svc._matchRay ? '<span class="badge badge-ray">RAY</span>' : '') +
      (svc._matchWbo ? '<span class="badge badge-wbo">WBO</span>' : '');

    return `<tr class="${hi ? 'highlight' : ''}">
      <td>${svc.std || '—'} / ${svc.etd || '—'}</td>
      <td>${svc.platform || '?'}</td>
      <td>${svc.destination || '—'}</td>
      <td>${badges || '<span style="color:#555">—</span>'}</td>
      <td style="color:#555;font-size:0.7rem;word-break:break-all;max-width:180px">${svc.serviceId || '—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('output').innerHTML = `
    <table>
      <thead><tr><th>Std / Etd</th><th>Plat</th><th>Destination</th><th>Match</th><th>Service ID</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="color:#555">No services</td></tr>'}</tbody>
    </table>`;
}
</script>
</body>
</html>
