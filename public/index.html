<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#060c18"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Raynes Park Transit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-deep:#060c18; --bg-card:#0e1828; --bg-card2:#132035; --border:#1e3050;
      --accent-blue:#2a7fff; --accent-teal:#00c9a7; --accent-amber:#ffb340;
      --accent-red:#ff4d6a; --accent-green:#00e676;
      --highlight-bg:rgba(0,230,118,0.08); --highlight-border:rgba(0,230,118,0.3);
      --text-primary:#e8f0fc; --text-dim:#6a85aa; --text-mid:#9ab0cc;
      --font-mono:'Space Mono',monospace; --font-body:'DM Sans',sans-serif;
      --radius:12px; --radius-sm:8px;
      --district:#007D32; --tramlink:#5FB526; --victoria:#0098D4;
      --jubilee:#868F98; --bakerloo:#894E24; --northern:#1a1a1a; --wc:#6BCDB2; --circle:#FFD329;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg-deep);color:var(--text-primary);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;z-index:0;
      background-image:linear-gradient(rgba(42,127,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(42,127,255,0.04) 1px,transparent 1px);
      background-size:40px 40px;pointer-events:none}
    #app{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 16px 40px}

    /* HEADER */
    header{padding:18px 0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:0}
    .logo-wrap{display:flex;align-items:center;gap:12px}
    .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-teal));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
    .logo-text{font-family:var(--font-mono);font-size:14px;font-weight:700;letter-spacing:0.04em}
    .logo-sub{font-size:10px;color:var(--text-dim);margin-top:2px;letter-spacing:0.08em;text-transform:uppercase}
    .logo-version{font-size:9px;color:var(--text-dim);margin-top:3px;opacity:0.7}
    #clock{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--accent-teal);letter-spacing:0.04em}
    #last-updated{font-size:10px;color:var(--text-dim);text-align:right}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-teal);display:inline-block;margin-right:5px;box-shadow:0 0 6px var(--accent-teal);animation:pulse-dot 2s infinite}
    @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}

    /* LOCATION NAV BAR */
    .loc-nav{display:flex;align-items:center;gap:8px;padding:14px 0;border-bottom:1px solid var(--border);margin-bottom:20px}
    .nav-arrow{background:none;border:1px solid var(--border);border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-size:18px;flex-shrink:0;transition:all 0.2s}
    .nav-arrow:hover{border-color:var(--accent-teal);color:var(--accent-teal)}
    .nav-arrow:disabled{opacity:0.3;cursor:not-allowed}
    .loc-select-wrap{flex:1;position:relative}
    .loc-select{width:100%;background:var(--bg-card);border:1px solid var(--accent-teal);border-radius:10px;color:var(--accent-teal);font-family:var(--font-mono);font-size:12px;font-weight:700;padding:9px 36px 9px 14px;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none;letter-spacing:0.04em}
    .loc-select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--accent-teal);font-size:12px;pointer-events:none}
    .loc-select option{background:var(--bg-card2);color:var(--text-primary);font-family:var(--font-mono)}

    /* LOCATION PANELS */
    .loc-panel{display:none}
    .loc-panel.active{display:block}
    .loc-title{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:0.06em;color:var(--accent-teal);margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .loc-title-icon{font-size:15px}

    /* FILTER BAR */
    .filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .filter-btn{padding:6px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;color:var(--text-dim);font-size:12px;font-weight:500;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:5px}
    .filter-btn:hover{border-color:var(--accent-blue);color:var(--text-primary)}
    .filter-btn.active{background:var(--highlight-bg);border-color:var(--highlight-border);color:var(--accent-green)}
    .filter-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-green);flex-shrink:0}
    .seg-control{display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:3px;gap:2px;flex-shrink:0}
    .seg-btn{padding:4px 10px;border-radius:14px;font-family:var(--font-mono);font-size:10px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--text-dim);transition:all 0.2s;white-space:nowrap}
    .seg-btn.active{background:var(--accent-amber);color:#000}
    .loc-refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-size:15px;margin-left:auto;transition:all 0.2s;flex-shrink:0}
    .loc-refresh-btn:hover{border-color:var(--accent-amber);color:var(--accent-amber)}
    .loc-refresh-btn.spinning{animation:spin 0.6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* SECTION */
    .section-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;padding-left:2px}
    .section-divider{height:1px;background:var(--border);margin:20px 0}

    /* ALERT */
    .alert-banner{background:rgba(255,77,106,0.1);border:1px solid rgba(255,77,106,0.35);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:14px;font-size:13px;color:#ff8fa0;display:none;align-items:flex-start;gap:10px}
    .alert-banner.visible{display:flex}
    .alert-icon{font-size:15px;flex-shrink:0;margin-top:1px}

    /* STOP CARD */
    .stop-grid{display:grid;gap:12px}
    @media(min-width:600px){.stop-grid.two-col{grid-template-columns:1fr 1fr}}
    .stop-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color 0.2s;margin-bottom:0}
    .stop-card:hover{border-color:rgba(42,127,255,0.4)}
    .stop-header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--bg-card2);border-bottom:1px solid var(--border)}
    .stop-name-row{display:flex;align-items:center;gap:9px;min-width:0}
    .stop-badge{min-width:32px;height:28px;padding:0 6px;background:linear-gradient(135deg,var(--accent-blue),var(--accent-teal));border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0.02em}
    .stop-name{font-size:13px;font-weight:600}
    .stop-sub-text{font-size:11px;color:var(--text-mid);margin-top:1px}
    .stop-routes{font-size:10px;color:var(--text-dim);margin-top:2px}
    .plat-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
    .plat-chip{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-dim);background:rgba(30,48,80,0.8);border:1px solid var(--border);border-radius:4px;padding:2px 5px}
    .stop-refresh-btn{background:none;border:1px solid var(--border);border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);font-size:13px;transition:all 0.2s;flex-shrink:0}
    .stop-refresh-btn:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
    .stop-refresh-btn.spinning{animation:spin 0.6s linear infinite}

    /* SUBGROUP */
    .subgroup{margin-bottom:18px}
    .subgroup-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;cursor:pointer;user-select:none}
    .subgroup-label{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim)}
    .subgroup-toggle{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;transition:all 0.2s}
    .subgroup-toggle:hover{border-color:var(--accent-blue);color:var(--accent-blue)}
    .subgroup-content.collapsed{display:none}

    /* DEPARTURE ROW */
    .departure-row{display:grid;grid-template-columns:42px 1fr auto auto auto;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid rgba(30,48,80,0.6);transition:background 0.15s}
    .departure-row:last-child{border-bottom:none}
    .departure-row:hover{background:rgba(42,127,255,0.04)}
    .departure-row.highlight{background:var(--highlight-bg);border-left:2px solid var(--accent-green);padding-left:11px}

    /* PILLS */
    .route-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;font-family:var(--font-mono);font-size:11px;font-weight:700;padding:3px 5px;min-width:36px;text-align:center}
    .pill-bus{background:rgba(42,127,255,0.15);border:1px solid rgba(42,127,255,0.3);color:var(--accent-blue)}
    .pill-SW{background:rgba(255,179,64,0.12);border:1px solid rgba(255,179,64,0.3);color:var(--accent-amber)}
    .pill-TL{background:rgba(0,160,200,0.15);border:1px solid rgba(0,160,200,0.35);color:#00a0c8}
    .pill-SN{background:rgba(0,150,90,0.15);border:1px solid rgba(0,150,90,0.35);color:#00c878}
    .pill-SE{background:rgba(0,115,170,0.15);border:1px solid rgba(0,115,170,0.35);color:#0090d4}
    .pill-LO{background:rgba(239,123,16,0.15);border:1px solid rgba(239,123,16,0.35);color:#ef7b10}
    .pill-GX{background:rgba(130,40,110,0.15);border:1px solid rgba(130,40,110,0.35);color:#c060b0}
    .pill-tube-district{background:#007D32;border:none;min-width:28px;height:20px}
    .pill-tube-tramlink{background:#5FB526;border:none;min-width:28px;height:20px}
    .pill-tube-victoria{background:#0098D4;border:none;min-width:28px;height:20px}
    .pill-tube-jubilee{background:#868F98;border:none;min-width:28px;height:20px}
    .pill-tube-bakerloo{background:#894E24;border:none;min-width:28px;height:20px}
    .pill-tube-northern{background:#1a1a1a;border:1px solid #444;min-width:28px;height:20px}
    .pill-tube-wc{background:#6BCDB2;border:none;min-width:28px;height:20px}
    .pill-tube-circle{background:#FFD329;border:none;min-width:28px;height:20px}

    .dest-wrap{min-width:0}
    .destination{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .highlight-badge{display:inline-block;font-size:9px;font-weight:700;background:var(--accent-green);color:#000;border-radius:3px;padding:1px 4px;margin-left:5px;vertical-align:middle;text-transform:uppercase}
    .dep-note{font-size:10px;color:var(--text-dim);margin-top:1px}
    .dep-time{font-family:var(--font-mono);font-size:11px;color:var(--text-mid);text-align:right}
    .dep-mins{font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:right;min-width:44px}
    .dep-mins.due{color:var(--accent-red)}
    .dep-mins.soon{color:var(--accent-amber)}
    .dep-mins.normal{color:var(--accent-teal)}
    .plat-tag{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);background:rgba(30,48,80,0.8);border:1px solid var(--border);border-radius:4px;padding:2px 5px;white-space:nowrap;text-align:center}

    /* STATES */
    .state-row{padding:16px 13px;text-align:center;color:var(--text-dim);font-size:13px}
    .loading-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent-blue);margin:0 3px;animation:bounce 1.2s infinite}
    .loading-dots span:nth-child(2){animation-delay:0.2s}
    .loading-dots span:nth-child(3){animation-delay:0.4s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-6px);opacity:1}}

    footer{text-align:center;font-size:11px;color:var(--text-dim);margin-top:28px;padding-top:14px;border-top:1px solid var(--border)}
  </style>
</head>
<body>

  <header>

    <button class="nav-arrow" id="nav-prev" onclick="navStep(-1)" title="Previous">‹</button>
    <div class="loc-select-wrap">
      <select class="loc-select" id="loc-select" onchange="selectLocation(this.value)"></select>
    </div>
    <button class="nav-arrow" id="nav-next" onclick="navStep(1)" title="Next">›</button>
  </div>

  <!-- ALERT -->
  <div id="alert-banner" class="alert-banner">
    <span class="alert-icon">⚠️</span>
    <div class="alert-text" id="alert-text"></div>
  </div>

  <!-- LOCATION PANELS -->
  <div id="loc-panels"></div>

  <footer>Data: TfL Open Data · National Rail OpenLDBWS · Auto-refreshes every 30s</footer>
</div>

// UK local time from ISO or HH:MM
function ukTime(s){
  try{
    if(!s) return '--:--';
    const d=s.includes('T')||s.includes('Z')?new Date(s):(()=>{const[h,m]=s.split(':').map(Number);const t=new Date();t.setHours(h,m,0,0);return t;})();
    return d.toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'});
  }catch(e){return '--:--';}
}

function minsLabel(m){ if(m<=0) return{text:'Due',cls:'due'}; if(m<=3) return{text:m+' min',cls:'due'}; if(m<=8) return{text:m+' min',cls:'soon'}; return{text:m+' min',cls:'normal'}; }
function minsFromNow(s){
  if(!s) return null;
  const now=new Date(); let t;
  if(s.includes('T')||s.includes('Z')){ t=new Date(s); }
  else{ const[h,m]=s.split(':').map(Number); t=new Date(); t.setHours(h,m,0,0); if(t<now) t.setDate(t.getDate()+1); }
  return Math.round((t-now)/60000);
}
function isHighlight(dest,cps){ if(cps?.length) return cps.some(cp=>HIGHLIGHT_STOPS.some(h=>cp.toLowerCase().includes(h.toLowerCase()))); if(!dest) return false; return HIGHLIGHT_STOPS.some(h=>dest.toLowerCase().includes(h.toLowerCase())); }
function loadingHTML(){ return '<div class="state-row"><div class="loading-dots"><span></span><span></span><span></span></div></div>'; }
function errorHTML(msg){ return `<div class="state-row" style="color:var(--accent-red)">⚠ ${msg}</div>`; }
function setUpdated(){ document.getElementById('last-updated').innerHTML='<span class="status-dot"></span>Updated '+new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'}); }
function getLetter(s){ return s.letter!==undefined?s.letter:s.key.split('_').pop(); }
function platChips(plats){ return plats.map(p=>`<span class="plat-chip">Plat ${p}</span>`).join(''); }
function classifyVXH(row){ return (row.dest||'').toLowerCase().includes('london waterloo')?'London Waterloo':'Waterloo-Reading line'; }

function depRow(r,type,locId){
  const l=minsLabel(r.mins);
  const hi=type!=='bus'&&isHighlight(r.dest,r.callingPoints);
  const pillClass=type==='bus'?'pill-bus':(r.pillClass||OP_PILL[r.op]||'');
  const platTag=r.plat?`<div class="plat-tag">Plat ${r.plat}</div>`:(type==='bus'||type==='tube'||type==='tram'?'':'<div class="plat-tag">TBA</div>');
  return `<div class="departure-row${hi?' highlight':''}">
    <div><span class="route-pill ${pillClass}">${r.route||''}</span></div>
    <div class="dest-wrap">
      <div class="destination">${r.dest||'—'}${hi?'<span class="highlight-badge">★</span>':''}</div>
      ${r.note?`<div class="dep-note">${r.note}</div>`:''}
    </div>
    <div class="dep-time">${r.time||'--:--'}</div>
    <div class="dep-mins ${l.cls}">${l.text}</div>
    ${platTag}
  </div>`;
}

function buildCard(label,chips,rows,type,locId,sub){
  const crs=LOCATIONS.find(l=>l.id===locId)?.nr?.crs;
  const filterOn=S.filter[locId];
  const filtered=filterOn?rows.filter(r=>isHighlight(r.dest,r.callingPoints)):rows;
  const rowsHTML=filtered.length
    ?filtered.map(r=>depRow(r,type,locId)).join('')
    :filterOn
      ?'<div class="state-row">No services to Raynes Park / Wimbledon Chase</div>'
      :'<div class="state-row">No upcoming departures</div>';
  return `<div class="stop-card" style="margin-bottom:12px">
    <div class="stop-header"><div class="stop-name-row"><div>
      <div class="stop-name">${label}</div>
      ${sub?`<div class="stop-sub-text">${sub}</div>`:''}
      ${chips?`<div class="plat-chips">${chips}</div>`:''}
    </div></div></div>
    <div>${rowsHTML}</div>
  </div>`;
}

function buildNav(){
  const sel=document.getElementById('loc-select');
  LOCATIONS.forEach((loc,i)=>{
    const opt=document.createElement('option');
    opt.value=loc.id; opt.textContent=loc.name; sel.appendChild(opt);
  });
  updateNavArrows();
}

function updateNavArrows(){
  document.getElementById('nav-prev').disabled=S.currentIdx===0;
  document.getElementById('nav-next').disabled=S.currentIdx===LOCATIONS.length-1;
}

function navStep(dir){
  const newIdx=S.currentIdx+dir;
  if(newIdx<0||newIdx>=LOCATIONS.length) return;
  S.currentIdx=newIdx;
  const id=LOCATIONS[newIdx].id;
  document.getElementById('loc-select').value=id;
  selectLocation(id);
}

function selectLocation(id){
  const idx=LOCATIONS.findIndex(l=>l.id===id);
  if(idx<0) return;
  S.currentIdx=idx;
  updateNavArrows();
  document.getElementById('loc-select').value=id;
  document.querySelectorAll('.loc-panel').forEach(p=>p.classList.toggle('active',p.id==='lpanel-'+id));
  if(!S.loaded.has(id)){ S.loaded.add(id); fetchLocation(id); }
}

// ══════════════════════════════════════════════════════════════════
// BUILD PANELS
// ══════════════════════════════════════════════════════════════════
function buildPanels(){
  const wrap=document.getElementById('loc-panels');
  LOCATIONS.forEach((loc,i)=>{
    const panel=document.createElement('div');
    panel.className='loc-panel'+(i===0?' active':'');
    panel.id='lpanel-'+loc.id;
    const hasNR=!!loc.nr?.crs;
    const hasGroups=hasNR&&(loc.nr.groups?.length>0);
    const hasFilter=hasNR&&loc.nr.filter;
    const seg=hasGroups?`<div class="seg-control">
      <button class="seg-btn active" id="seg-g-${loc.id}" onclick="setViewMode('${loc.id}','grouped')">Grouped</button>
      <button class="seg-btn" id="seg-p-${loc.id}" onclick="setViewMode('${loc.id}','platform')">By Platform</button>
    </div>`:'';
    const fBtn=hasFilter?`<button class="filter-btn" id="filter-${loc.id}" onclick="toggleFilter('${loc.id}')"><span class="filter-dot"></span> To Raynes Park / Wimbledon Chase</button>`:'';
    panel.innerHTML=`
      <div class="loc-title"><span class="loc-title-icon">${loc.icon}</span>${loc.name}</div>
      <div class="filter-bar">${fBtn}${seg}<button class="loc-refresh-btn" id="lrf-${loc.id}" onclick="refreshLocation('${loc.id}')" title="Refresh">↻</button></div>
      <div id="lcon-${loc.id}">${loadingHTML()}</div>`;
    wrap.appendChild(panel);
  });
}

function setViewMode(id,mode){
  S.viewMode[id]=mode;
  document.getElementById('seg-g-'+id)?.classList.toggle('active',mode==='grouped');
  document.getElementById('seg-p-'+id)?.classList.toggle('active',mode==='platform');
  if(S.cache[id]) renderLocation(id);
}

async function toggleFilter(id){
  S.filter[id]=!S.filter[id];
  document.getElementById('filter-'+id)?.classList.toggle('active',S.filter[id]);
  if(!S.filter[id]){ if(S.cache[id]) renderLocation(id); return; }
  if(!S.cache[id]) return;
  document.getElementById('lcon-'+id).innerHTML=loadingHTML();
  const services=S.cache[id].nr?.services||[];
  await Promise.all(services.map(async svc=>{
    if(svc.callingPoints||!svc.serviceId) return;
    try{
      const res=await fetch(`/api/calling-points?serviceId=${encodeURIComponent(svc.serviceId)}`,{signal:AbortSignal.timeout(8000)});
      if(res.ok){ const d=await res.json(); svc.callingPoints=d.callingPoints||[]; }
    }catch(e){ svc.callingPoints=[]; }
  }));
  renderLocation(id);
}

async function refreshLocation(id){
  const btn=document.getElementById('lrf-'+id);
  if(btn) btn.classList.add('spinning');
  S.loaded.delete(id); S.cache[id]=null;
  await fetchLocation(id);
  if(btn) btn.classList.remove('spinning');
}

// ══════════════════════════════════════════════════════════════════
// FETCH
// ══════════════════════════════════════════════════════════════════
async function fetchLocation(id){
  const loc=LOCATIONS.find(l=>l.id===id);
  if(!loc) return;
  document.getElementById('lcon-'+id).innerHTML=loadingHTML();
  try{
    const [nr,tube,tram]=await Promise.all([
      loc.nr?.crs ? fetchNR(loc.nr.crs) : Promise.resolve(null),
      loc.tube    ? fetchTubeLines(loc.tube) : Promise.resolve(null),
      loc.tram    ? fetchTubeLines(loc.tram) : Promise.resolve(null),
    ]);
    S.cache[id]={nr,tube,tram};
    if(loc.buses){
      loc.buses.flatMap(bg=>bg.stops||[]).forEach(s=>{
        if(!S.loadedBus.has(s.key)){ S.loadedBus.add(s.key); fetchBusStop(s.key); }
      });
    }
    renderLocation(id);
    setUpdated();
  }catch(e){ document.getElementById('lcon-'+id).innerHTML=errorHTML('Could not load data'); }
}

async function fetchNR(crs){
  const res=await fetch(`/api/trains?crs=${crs}&rows=50`,{signal:AbortSignal.timeout(12000)});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(d.error) throw new Error(d.error);
  return d;
}

async function fetchTubeLines(lines){
  const results={};
  await Promise.all(lines.map(async l=>{
    try{
      const res=await fetch(`https://api.tfl.gov.uk/Line/${l.line}/Arrivals/${l.stopId}?app_key=${TFL_KEY}`);
      if(res.ok) results[l.line]=await res.json();
    }catch(e){ results[l.line]=[]; }
  }));
  return results;
}

async function fetchBusStop(key){
  const stop=STOP_MAP[key];
  if(!stop) return;
  const el=document.getElementById('deps-'+key);
  if(el) el.innerHTML=loadingHTML();
  try{
    const url=stop.isTram
      ?`https://api.tfl.gov.uk/Line/tram/Arrivals/${stop.naptan}?app_key=${TFL_KEY}`
      :`https://api.tfl.gov.uk/StopPoint/${stop.naptan}/Arrivals?app_key=${TFL_KEY}`;
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(!Array.isArray(data)) throw new Error('Bad response');
    const type=stop.isTram?'tram':'bus';
    const rows=data
      .filter(d=>!stop.isTram||d.direction==='inbound')
      .sort((a,b)=>a.timeToStation-b.timeToStation).slice(0,6)
      .map(d=>({route:stop.isTram?'':d.lineName, pillClass:stop.isTram?'pill-tube-tramlink':null,
        dest:d.destinationName||d.towards||'—', mins:Math.round(d.timeToStation/60),
        time:ukTime(d.expectedArrival), note:null, plat:null}));
    S.busCache[key]=rows;
    if(el) el.innerHTML=rows.length?rows.map(r=>depRow(r,type,null)).join(''):'<div class="state-row">No upcoming departures</div>';
  }catch(e){ if(el) el.innerHTML=errorHTML('Could not load'); }
}

async function refreshBusStop(key){
  const btn=document.getElementById('btn-'+key);
  if(btn) btn.classList.add('spinning');
  S.loadedBus.delete(key);
  await fetchBusStop(key);
  S.loadedBus.add(key);
  if(btn) btn.classList.remove('spinning');
  setUpdated();
}

function toggleSubgroup(header){
  const content=header.nextElementSibling;
  const btn=header.querySelector('.subgroup-toggle');
  const collapsed=content.classList.contains('collapsed');
  content.classList.toggle('collapsed',!collapsed);
  btn.textContent=collapsed?'Hide':'Show';
}

// ══════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════
function renderLocation(id){
  const loc=LOCATIONS.find(l=>l.id===id);
  const{nr:nrData,tube:tubeData,tram:tramData}=S.cache[id]||{};
  const container=document.getElementById('lcon-'+id);
  if(!container) return;
  let html='';
  const mode=S.viewMode[id]||'grouped';

  // ── NATIONAL RAIL ──
  if(loc.nr?.crs && nrData){
    html+=`<div class="section-label">National Rail</div>`;
    const byPlat={};
    let affectedCount=0;
    const msgs=nrData.messages||[];
    (nrData.services||[]).forEach(svc=>{
      const plat=svc.platform||'TBA';
      const{std,etd}=svc;
      const isCancelled=etd==='Cancelled';
      const isDelayed=etd&&etd!=='On time'&&etd!=='Cancelled'&&etd!==std&&/^\d{2}:\d{2}$/.test(etd);
      if(isCancelled){affectedCount++;return;}
      if(isDelayed) affectedCount++;
      const displayTime=(etd&&/^\d{2}:\d{2}$/.test(etd))?etd:(std||'--:--');
      const mins=minsFromNow(displayTime);
      if(mins===null||mins<-2||mins>30) return;
      const op=ATOC_MAP[(svc.operatorCode||'').toUpperCase()]||'';
      if(!byPlat[plat]) byPlat[plat]=[];
      byPlat[plat].push({route:op,op,dest:svc.destination||'—',mins,time:displayTime,
        note:isDelayed?`⚠ was ${std}`:null,plat,
        callingPoints:svc.callingPoints||null,serviceId:svc.serviceId||null});
    });
    // Alerts
    const alertEl=document.getElementById('alert-banner');
    if(affectedCount>0||msgs.length>0){
      document.getElementById('alert-text').textContent=msgs.length?msgs[0]:`${affectedCount} service(s) affected`;
      alertEl.classList.add('visible');
    } else { alertEl.classList.remove('visible'); }

    const grps=loc.nr.groups||[];
    if(grps.length&&mode==='grouped'){
      // CLJ dynamic platform routing
      if(loc.nr.dynamicPlatforms){
        Object.entries(loc.nr.dynamicPlatforms).forEach(([plat,opMap])=>{
          (byPlat[plat]||[]).forEach(row=>{
            const label=opMap[row.op]||'Other';
            if(!byPlat['_dyn_'+label]) byPlat['_dyn_'+label]=[];
            byPlat['_dyn_'+label].push({...row,plat});
          });
          delete byPlat[plat];
        });
      }
      // VXH dynamic grouping by destination
      if(loc.nr.dynamicGroups&&loc.id==='vauxhall'){
        const fixed=grps.flatMap(g=>g.plats);
        Object.keys(byPlat).filter(p=>!p.startsWith('_')).forEach(plat=>{
          if(fixed.includes(plat)) return;
          (byPlat[plat]||[]).forEach(row=>{
            const label=classifyVXH(row);
            if(!byPlat['_dyn_'+label]) byPlat['_dyn_'+label]=[];
            byPlat['_dyn_'+label].push({...row,plat});
          });
          delete byPlat[plat];
        });
      }
      // Render groups in defined order
      grps.forEach(grp=>{
        const rows=[];
        grp.plats.forEach(p=>{if(byPlat[p]){rows.push(...byPlat[p]);delete byPlat[p];}});
        ['_merge_','_dyn_'].forEach(pfx=>{const k=pfx+grp.label;if(byPlat[k]){rows.push(...byPlat[k]);delete byPlat[k];}});
        if(!rows.length) return;
        rows.sort((a,b)=>a.mins-b.mins);
        const chipPlats=grp.plats.length?grp.plats:[...new Set(rows.map(r=>r.plat).filter(Boolean))];
        html+=buildCard(grp.label,platChips(chipPlats),rows,'train',id);
      });
    }
    // By-platform / remaining
    const fp=PLAT_FIRST[loc.nr.crs]||[];
    Object.keys(byPlat).filter(p=>!p.startsWith('_')).sort((a,b)=>{
      if(a==='TBA') return 1; if(b==='TBA') return -1;
      const ai=fp.indexOf(a),bi=fp.indexOf(b);
      if(ai>=0&&bi<0) return -1; if(bi>=0&&ai<0) return 1; if(ai>=0&&bi>=0) return ai-bi;
      const na=parseInt(a),nb=parseInt(b);
      if(isNaN(na)&&isNaN(nb)) return a.localeCompare(b);
      if(isNaN(na)) return 1; if(isNaN(nb)) return -1;
      return na-nb;
    }).forEach(plat=>{
      const rows=byPlat[plat].sort((a,b)=>a.mins-b.mins);
      if(!rows.length) return;
      const isTBA=plat==='TBA';
      html+=buildCard(isTBA?'Platform TBA':'Platform '+plat,`<span class="plat-chip">Plat ${plat}</span>`,rows,'train',id,isTBA?'Platform not yet assigned':null);
    });
  }

  // ── TUBE ──
  if(tubeData&&loc.tube){
    if(html) html+=`<div class="section-divider"></div>`;
    html+=`<div class="section-label">London Underground</div>`;
    const mergeLines=loc.tube.length>1&&loc.tube.every(l=>l.stopId===loc.tube[0].stopId);
    if(mergeLines){
      const merged={};
      loc.tube.forEach(lc=>{
        (tubeData[lc.line]||[]).forEach(a=>{
          const mins=Math.round(a.timeToStation/60);
          if(mins>15) return;
          const p=a.platformName||lc.line;
          if(!merged[p]) merged[p]=[];
          merged[p].push({route:'',pillClass:lc.pillClass,dest:a.destinationName||a.towards||'—',mins,time:ukTime(a.expectedArrival),note:null,plat:null});
        });
      });
      const dirOrder=p=>p.toLowerCase().includes('east')?0:p.toLowerCase().includes('west')?1:2;
      Object.entries(merged).sort(([a],[b])=>dirOrder(a)-dirOrder(b)||a.localeCompare(b)).forEach(([pName,rows])=>{
        if(!rows.length) return;
        rows.sort((a,b)=>a.mins-b.mins);
        const m=pName.match(/eastbound|westbound/i);
        html+=buildCard(m?m[0].charAt(0).toUpperCase()+m[0].slice(1).toLowerCase():pName,null,rows,'tube',id);
      });
    } else {
      loc.tube.forEach(lc=>{
        const arrivals=tubeData[lc.line]||[];
        if(!arrivals.length) return;
        const isCombined=lc.line==='district'&&loc.id==='wimbledon';
        if(isCombined){
          const rows=arrivals.filter(a=>Math.round(a.timeToStation/60)<=15).sort((a,b)=>a.timeToStation-b.timeToStation)
            .map(a=>({route:'',pillClass:lc.pillClass,dest:a.destinationName||a.towards||'—',
              mins:Math.round(a.timeToStation/60),time:ukTime(a.expectedArrival),note:a.towards||null,
              plat:a.platformName?(a.platformName.replace(/[^\d]/g,'')||null):null}));
          if(!rows.length) return;
          const platNums=[...new Set(arrivals.map(a=>a.platformName).filter(Boolean))];
          const chips=platNums.map(p=>{const m=p.match(/\d+[ab]?$/i);return`<span class="plat-chip">Plat ${m?m[0]:p}</span>`;}).join('');
          html+=buildCard(lc.label,chips,rows,'tube',id);
        } else {
          const tubePlats={};
          arrivals.forEach(a=>{
            const mins=Math.round(a.timeToStation/60);
            if(mins>15) return;
            const p=a.platformName||lc.line;
            if(!tubePlats[p]) tubePlats[p]=[];
            tubePlats[p].push({route:'',pillClass:lc.pillClass,dest:a.destinationName||a.towards||'—',mins,time:ukTime(a.expectedArrival),note:a.towards||null,plat:null});
          });
          Object.entries(tubePlats).sort(([a],[b])=>a.localeCompare(b)).forEach(([pName,rows])=>{
            if(!rows.length) return;
            rows.sort((a,b)=>a.mins-b.mins);
            html+=buildCard(lc.label,null,rows,'tube',id,pName);
          });
        }
      });
    }
  }

  // ── TRAM ──
  if(tramData&&loc.tram){
    if(html) html+=`<div class="section-divider"></div>`;
    html+=`<div class="section-label">London Trams</div>`;
    loc.tram.forEach(lc=>{
      const arrivals=tramData[lc.line]||[];
      if(!arrivals.length) return;
      const rows=arrivals.filter(a=>Math.round(a.timeToStation/60)<=15).sort((a,b)=>a.timeToStation-b.timeToStation)
        .map(a=>({route:'',pillClass:lc.pillClass,dest:a.destinationName||a.towards||'—',
          mins:Math.round(a.timeToStation/60),time:ukTime(a.expectedArrival),note:a.towards||null,
          plat:a.platformName?(a.platformName.replace(/Platform\s*/i,'').trim()||null):null}));
      if(!rows.length) return;
      const platNums=[...new Set(arrivals.map(a=>a.platformName).filter(Boolean))];
      html+=buildCard(lc.label,platNums.map(p=>`<span class="plat-chip">${p}</span>`).join(''),rows,'tram',id);
    });
  }

  // ── BUSES ──
  if(loc.buses?.length){
    if(html) html+=`<div class="section-divider"></div>`;
    html+=`<div class="section-label">Buses</div>`;
    loc.buses.forEach(bg=>{
      if(bg.flat){
        html+=`<div class="stop-grid two-col">${(bg.stops||[]).map(busStopCardHTML).join('')}</div>`;
      } else {
        html+=`<div class="subgroup">
          <div class="subgroup-header" onclick="toggleSubgroup(this)">
            <div class="subgroup-label">${bg.subgroup}</div>
            <button class="subgroup-toggle">${bg.defaultOpen?'Hide':'Show'}</button>
          </div>
          <div class="subgroup-content${bg.defaultOpen?'':' collapsed'}">
            <div class="stop-grid two-col">${(bg.stops||[]).map(busStopCardHTML).join('')}</div>
          </div>
        </div>`;
      }
    });
  }

  container.innerHTML=html||'<div class="state-row">No data available</div>';
}

function busStopCardHTML(s){
  return `<div class="stop-card">
    <div class="stop-header">
      <div class="stop-name-row">
        <div class="stop-badge">${getLetter(s)}</div>
        <div>
          <div class="stop-name">${s.name}</div>
          <div class="stop-sub-text">${s.sub}</div>
          <div class="stop-routes">${s.routes}</div>
        </div>
      </div>
      <button class="stop-refresh-btn" id="btn-${s.key}" onclick="refreshBusStop('${s.key}')" title="Refresh">↻</button>
    </div>
    <div id="deps-${s.key}">${loadingHTML()}</div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════
// AUTO REFRESH
// ══════════════════════════════════════════════════════════════════
setInterval(()=>{
  const id=LOCATIONS[S.currentIdx]?.id;
  if(!id) return;
  S.loaded.delete(id); S.cache[id]=null;
  fetchLocation(id);
  const loc=LOCATIONS.find(l=>l.id===id);
  if(loc?.buses) loc.buses.flatMap(bg=>bg.stops||[]).forEach(s=>{ S.loadedBus.delete(s.key); fetchBusStop(s.key); });
},30000);

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
(async()=>{
  try{
    const res=await fetch(window.location.pathname,{method:'HEAD'});
    const lm=res.headers.get('Last-Modified');
    if(lm){
      const d=new Date(lm);
      const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      document.getElementById('app-version').textContent=`Version: ${d.getDate()} ${mo[d.getMonth()]} ${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
  }catch(e){}
})();

buildStopMap();
buildNav();
buildPanels();
selectLocation(LOCATIONS[0].id);
</script>
</body>
</html>
