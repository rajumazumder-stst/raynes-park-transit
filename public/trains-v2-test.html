<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trains-v2 test</title>
<style>
  body { font-family: monospace; background: #060c18; color: #cdd9f0; padding: 20px; }
  h2 { color: #2a7fff; }
  select, button { background: #0e1828; color: #cdd9f0; border: 1px solid #1e3050; padding: 6px 12px; border-radius: 4px; font-family: monospace; font-size: 14px; cursor: pointer; }
  button { color: #2a7fff; margin-left: 8px; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; }
  th { text-align: left; color: #2a7fff; border-bottom: 1px solid #1e3050; padding: 6px 10px; }
  td { padding: 6px 10px; border-bottom: 1px solid #0e1828; vertical-align: top; }
  .calling { color: #868f98; font-size: 12px; margin-top: 4px; }
  .highlight { color: #00e676; font-weight: bold; }
  .err { color: #ff4d6a; }
  #status { margin: 12px 0; color: #ffb340; }
  .msg { background: #1a1a00; border-left: 3px solid #ffb340; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
</style>
</head>
<body>
<h2>trains-v2 endpoint test</h2>

<label>Station CRS:
  <select id="crs">
    <option>RAY</option><option>WBO</option><option>WAT</option><option>VXH</option>
    <option>NEM</option><option>WIM</option><option>NBT</option><option>CLJ</option>
    <option>KNG</option><option>PUT</option><option>SNS</option><option>BFR</option><option>WAE</option>
  </select>
</label>
<button onclick="load()">Fetch</button>

<div id="status"></div>
<div id="messages"></div>
<table id="results" style="display:none">
  <thead><tr><th>Plat</th><th>Std</th><th>Etd</th><th>Op</th><th>Destination + Calling Points</th><th>serviceId</th></tr></thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const HIGHLIGHT_STOPS = ['Raynes Park', 'Wimbledon Chase'];

async function load() {
  const crs = document.getElementById('crs').value;
  document.getElementById('status').textContent = 'Loading…';
  document.getElementById('messages').innerHTML = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('tbody').innerHTML = '';

  try {
    const res = await fetch(`/api/trains-v2?crs=${crs}&rows=50`);
    const data = await res.json();

    if (!res.ok || data.error) {
      document.getElementById('status').innerHTML = `<span class="err">Error: ${data.error || res.status}</span>`;
      return;
    }

    document.getElementById('status').textContent = `${data.services.length} services — ${new Date().toLocaleTimeString('en-GB', {timeZone:'Europe/London'})}`;

    if (data.messages.length) {
      document.getElementById('messages').innerHTML = data.messages.map(m => `<div class="msg">${m}</div>`).join('');
    }

    const tbody = document.getElementById('tbody');
    data.services.forEach(svc => {
      const callsHighlight = svc.callingPoints.some(cp =>
        HIGHLIGHT_STOPS.some(h => cp.toLowerCase().includes(h.toLowerCase()))
      );
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${svc.platform ?? '?'}</td>
        <td>${svc.std}</td>
        <td>${svc.etd}</td>
        <td>${svc.operatorCode ?? '—'}</td>
        <td>
          <span class="${callsHighlight ? 'highlight' : ''}">${svc.destination}</span>
          <div class="calling">${svc.callingPoints.join(' → ') || '(no calling points)'}</div>
        </td>
        <td style="font-size:11px;color:#868f98">${svc.serviceId ?? '—'}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('results').style.display = '';
  } catch (err) {
    document.getElementById('status').innerHTML = `<span class="err">${err.message}</span>`;
  }
}

load();
</script>
</body>
</html>
